[package]
name = "bestls"
version = "0.1.0"
edition = "2024"
description = "A user-friendly ls alternative with human-readable sizes and relative timestamps"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.41"
clap = { version = "4.5.39", features = ["derive"] }
owo-colors = "4.2.1"
tabled = { version = "0.20.0", features = ["ansi"] }
libc = "0.2.186"
